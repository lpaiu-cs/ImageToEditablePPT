[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "image-to-editable-ppt"
version = "0.1.0"
description = "Conservative structural diagram to editable PPTX converter"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.10",
  "Pillow>=11.0",
  "python-pptx>=1.0.2",
]

[project.optional-dependencies]
ml = [
  "torch",
  "torchvision",
  "lightning",
  "torchmetrics",
  "omegaconf",
  "tensorboard",
  "mlflow",
]
ocr = ["pytesseract>=0.3.10"]
test = ["pytest>=8"]

[project.scripts]
image-to-editable-ppt = "image_to_editable_ppt.cli:main"
image-to-editable-ppt-train-detector = "image_to_editable_ppt.ml.train_detector:main"
image-to-editable-ppt-infer-detector = "image_to_editable_ppt.ml.infer_detector:main"
image-to-editable-ppt-eval-detector = "image_to_editable_ppt.ml.eval_detector:main"
image-to-editable-ppt-generate-dataset = "image_to_editable_ppt.ml.generate_dataset:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
